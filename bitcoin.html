
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payments - BTC</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 15px;
    color: white;
}

.container {
    width: 100%;
    max-width: 600px;
    background: #111;
    border-radius: 14px;
    padding: 35px;
    box-shadow: 0 15px 45px rgba(0,0,0,.12);
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header img {
    width: 60px;
    height: 60px;
    object-fit: contain;
    margin-bottom: 15px;
}

h1 {
    font-size: 28px;
    margin-bottom: 9px;
}

.subtitle {
    color: #999;
    font-size: 13px;
}

.section {
    background: #1c1c1c;
    border: 1px solid #333;
    border-radius: 10px;
    padding: 20px;
    margin-top: 18px;
}

.section h2 {
    font-size: 16px;
    margin-bottom: 17px;
}

.wallet {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #111;
    border: 1px solid #383838;
    padding: 12px;
    border-radius: 8px;
}

.wallet-address {
    flex: 1;
    min-width: 0;
    color: #ddd;
    font-size: 12px;
    overflow-wrap: anywhere;
    line-height: 1.5;
}

.copy-btn {
    border: none;
    background: #fff;
    color: #111;
    padding: 10px 13px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
    white-space: nowrap;
}

.copy-btn:hover {
    background: #ccc;
}

label {
    display: block;
    color: #aaa;
    font-size: 12px;
    margin-bottom: 9px;
}

input {
    width: 100%;
    background: #111;
    color: white;
    border: 1px solid #383838;
    padding: 14px;
    border-radius: 7px;
    outline: none;
    font-size: 15px;
    margin-bottom: 15px;
}

input:focus {
    border-color: white;
}

.result {
    background: #292929;
    padding: 15px;
    border-radius: 8px;
}

.result small {
    color: #999;
    font-size: 11px;
}

.result-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 8px;
}

.result-row h3 {
    font-size: 21px;
    overflow-wrap: anywhere;
    min-width: 0;
}

.result-row .copy-btn {
    flex-shrink: 0;
}

.price-info {
    text-align: center;
    color: #888;
    font-size: 11px;
    margin-top: 20px;
    line-height: 1.6;
}

.status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #8ce5a9;
    font-size: 11px;
    margin-top: 12px;
}

.dot {
    width: 7px;
    height: 7px;
    background: #65d98c;
    border-radius: 50%;
}

.back {
    display: block;
    text-align: center;
    color: #aaa;
    font-size: 12px;
    text-decoration: none;
    margin-top: 25px;
}

.back:hover {
    color: white;
}

@media(max-width: 480px) {
    .container {
        padding: 25px 16px;
    }

    h1 {
        font-size: 24px;
    }

    .section {
        padding: 16px;
    }

    .wallet {
        flex-wrap: wrap;
    }

    .wallet .copy-btn {
        width: 100%;
    }

    .result-row {
        align-items: flex-start;
    }

    .result-row h3 {
        font-size: 17px;
    }
}

@media(max-width: 350px) {
    .result-row {
        flex-direction: column;
    }

    .result-row .copy-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <img src="https://crxtalx.github.io/payments//img/bitcoin.avif" alt="Bitcoin">

        <h1>Bitcoin</h1>

        <div class="status">
            <span class="dot"></span>
            Live exchange rates
        </div>

    </div>

    <!-- BITCOIN WALLET -->

    <div class="section">

        <h2>₿ My Bitcoin wallet</h2>

        <div class="wallet">

            <span class="wallet-address" id="walletAddress">
                bc1qn7hzkx47pa4jv5fldc7yer7tlzxx9558eh9efc
            </span>

            <button class="copy-btn" onclick="copyWallet(this)">
                Copy
            </button>

        </div>

    </div>

    <!-- EURO TO BITCOIN -->

    <div class="section">

        <h2>€ EUR → ₿ Bitcoin</h2>

        <label for="eurAmount">
            Amount in Euros (EUR)
        </label>

        <input
            type="number"
            id="eurAmount"
            placeholder="Enter EUR amount"
            min="0"
            step="any"
            value="100"
            oninput="calculateEUR()"
        >

        <div class="result">

            <small>YOU RECEIVE</small>

            <div class="result-row">

                <h3 id="btcResult">Loading...</h3>

                <button
                    class="copy-btn"
                    onclick="copyResult('btcResult', this)"
                >
                    Copy
                </button>

            </div>

        </div>

    </div>

    <!-- BITCOIN TO EURO -->

    <div class="section">

        <h2>₿ Bitcoin → € EUR</h2>

        <label for="btcAmount">
            Amount in Bitcoin (BTC)
        </label>

        <input
            type="number"
            id="btcAmount"
            placeholder="Enter BTC amount"
            min="0"
            step="any"
            value="1"
            oninput="calculateBTC()"
        >

        <div class="result">

            <small>YOU RECEIVE</small>

            <div class="result-row">

                <h3 id="eurResult">Loading...</h3>

                <button
                    class="copy-btn"
                    onclick="copyResult('eurResult', this)"
                >
                    Copy
                </button>

            </div>

        </div>

    </div>

    <!-- PRICE INFORMATION -->

    <p class="price-info" id="priceInfo">
        Retrieving Bitcoin market price...
    </p>

    <a href="index.html" class="back">
        ← Back to currencies
    </a>

</div>

<script>

// ========================================
// YOUR BITCOIN WALLET ADDRESS
// ========================================

const WALLET_ADDRESS = "bc1qvq8ahshvg0kc9plz7nu3u537zqsts7zdc79t92";

document.getElementById("walletAddress").textContent =
    WALLET_ADDRESS;

// ========================================
// BITCOIN LIVE PRICE
// ========================================

let bitcoinEUR = 0;

const formatter = new Intl.NumberFormat("en-US", {
    maximumFractionDigits: 8
});

function format(value) {
    return formatter.format(value);
}

// ========================================
// FETCH LIVE BITCOIN PRICE
// ========================================

async function fetchBitcoinPrice() {

    const info = document.getElementById("priceInfo");

    try {

        const response = await fetch(
            "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur"
        );

        if (!response.ok) {
            throw new Error("Price unavailable");
        }

        const data = await response.json();

        bitcoinEUR = data.bitcoin.eur;

        calculateEUR();
        calculateBTC();

        info.textContent =
            "1 BTC = €" +
            bitcoinEUR.toLocaleString("en-US") +
            " | Live price provided by CoinGecko";

    } catch (error) {

        info.textContent =
            "Unable to retrieve live Bitcoin prices. Please try again.";

    }

}

// ========================================
// EUR TO BTC
// ========================================

function calculateEUR() {

    const amount = Number(
        document.getElementById("eurAmount").value
    );

    const result = document.getElementById("btcResult");

    if (bitcoinEUR <= 0) {
        result.textContent = "Loading...";
        return;
    }

    if (!Number.isFinite(amount) || amount < 0) {
        result.textContent = "Invalid amount";
        return;
    }

    const btc = amount / bitcoinEUR;

    result.textContent = format(btc) + " BTC";

}

// ========================================
// BTC TO EUR
// ========================================

function calculateBTC() {

    const amount = Number(
        document.getElementById("btcAmount").value
    );

    const result = document.getElementById("eurResult");

    if (bitcoinEUR <= 0) {
        result.textContent = "Loading...";
        return;
    }

    if (!Number.isFinite(amount) || amount < 0) {
        result.textContent = "Invalid amount";
        return;
    }

    const eur = amount * bitcoinEUR;

    result.textContent =
        "€" + eur.toLocaleString("en-US", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

}

// ========================================
// COPY WALLET ADDRESS
// ========================================

async function copyWallet(button) {

    if (
        !WALLET_ADDRESS ||
        WALLET_ADDRESS === "YOUR_BITCOIN_WALLET_ADDRESS"
    ) {

        button.textContent = "Add wallet first";

        setTimeout(() => {
            button.textContent = "Copy";
        }, 2000);

        return;
    }

    try {

        await navigator.clipboard.writeText(WALLET_ADDRESS);

        button.textContent = "Copied!";

        setTimeout(() => {
            button.textContent = "Copy";
        }, 2000);

    } catch (error) {

        button.textContent = "Copy failed";

        setTimeout(() => {
            button.textContent = "Copy";
        }, 2000);

    }

}

// ========================================
// COPY CALCULATOR RESULTS
// ========================================

async function copyResult(elementId, button) {

    const text = document
        .getElementById(elementId)
        .textContent;

    if (
        !text ||
        text === "Loading..." ||
        text === "Invalid amount"
    ) {
        return;
    }

    try {

        await navigator.clipboard.writeText(text);

        button.textContent = "Copied!";

        setTimeout(() => {
            button.textContent = "Copy";
        }, 2000);

    } catch (error) {

        button.textContent = "Copy failed";

        setTimeout(() => {
            button.textContent = "Copy";
        }, 2000);

    }

}

// ========================================
// INITIALIZE
// ========================================

fetchBitcoinPrice();

// Refresh Bitcoin price every 60 seconds

setInterval(fetchBitcoinPrice, 60000);

</script>

</body>
</html>
